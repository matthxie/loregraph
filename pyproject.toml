[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "you-kg"
# The `+new.approach` local segment is deliberate: this branch is an experiment paired with
# brainbrain's `new-approach` branch, NOT a release cut from main. It keeps the two apart —
# a bare 0.1.19 released from main can never collide with this wheel, so pip cannot
# silently keep one when the other was meant (the exact failure engine/requirements.txt's
# RELEASE RULE warns about). The BASE version tracks the last main merged IN (so the number
# says which mainline this build contains); paired-wheel iterations between merges bump the
# local segment's trailing number (.2, .3, …) — a new version per wheel either way.
version = "0.1.19+new.approach"
description = "Temporal knowledge-graph memory engine: cue-gated extraction, bi-temporal facts, graph-first (PPR) retrieval, one-call RAG answers."
readme = "README.md"
authors = [{ name = "Matthew Xie" }]
requires-python = ">=3.10"
# Core runtime: exactly what kg/'s serving path (daemon/engine/store/retrieval/
# ingest/rag) imports. The research/eval stack lives in the extras below and in
# requirements.txt (the full research/dev environment).
dependencies = [
    "networkx>=3.6",           # graph store, PageRank, BFS, communities
    "numpy>=2.0",              # vectors, brute-force cosine index
    "scipy>=1.13",             # cached sparse PPR operator (kg/retrieval.py)
    "rank-bm25>=0.2.2",        # BM25 lexical seed signal (token-overlap fallback exists)
    "sentence-transformers>=5.0",  # BAAI/bge-small-en-v1.5 — the ONLY embedder (hashing fallback removed)
    "torch>=2.6",              # sentence-transformers backend
    "openai>=1.0",             # default LLM provider (KG_LLM=openai); mock/none/codex need no SDK
    "python-dotenv>=1.0",      # optional .env loading (import-guarded, but cheap and expected)
    "trafilatura>=1.8",        # main-text extraction from fetched URLs (strips page boilerplate)
    # The default `cue_gated` extractor's local floor is gliner_yake_cooccur
    # (kg/nlp_extractors.py): with any real provider (KG_LLM=codex/openai) the daemon
    # imports these at drain time — they ARE the serving path, not eval tooling.
    # spacy additionally needs the en_core_web_sm model, which is not on PyPI; installers
    # must add it themselves (e.g. `python -m spacy download en_core_web_sm` or pin the
    # model wheel URL, as the brainbrain app's engine/requirements.txt does).
    "gliner>=0.2.27",          # zero-shot NER backend (urchade/gliner_small-v2.1)
    "yake>=0.4.8",             # statistical topical-tag keyphrases
    "spacy>=3.8",              # parses for co-occurrence/SVO relations
]

[project.optional-dependencies]
# Corpus/eval tooling + alternative extractor backends not used by the default
# serving path (the cue_gated floor's gliner/yake/spacy live in core, above).
research = [
    "scikit-learn>=1.5",   # cosine helpers / label-propagation fallbacks (eval-side)
    "datasets>=2.18",      # corpus building (scripts/build_dataset.py)
    "pillow>=10",          # corpus building (image handling)
    "keybert>=0.8",        # optional alt tagger (YAKE beat it here)
    "rake-nltk>=1.0",      # optional alt tagger (rejected on this corpus)
]

[project.scripts]
kg = "kg.cli:main"

[tool.setuptools]
# Include the cold-import subpackages — the 0.1.15 wheel shipped with only "kg", so
# kg/code (repo ingest) and kg/imports (chat/vault) were missing and import_* crashed.
packages = ["kg", "kg.code", "kg.imports"]
