[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "you-kg"
version = "0.1.0"
description = "Temporal knowledge-graph memory engine: cue-gated extraction, bi-temporal facts, graph-first (PPR) retrieval, one-call RAG answers."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["kg"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
