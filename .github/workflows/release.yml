# Release pipeline: manually triggered. Builds the loregraph wheel, tags this repo,
# and uploads the wheel as a workflow artifact for manual download.
#
# Versioning contract:
#   * Humans own major.minor — bump them by editing `version` in pyproject.toml
#     (breaking interface change -> major, additive -> minor).
#   * The pipeline owns the patch digit: <major.minor>.<run_number>. Every release is
#     unique by construction; the stamped pyproject is never committed back (no
#     write-back commits, no skip-ci loops). pip treats a same-version wheel as
#     already-installed and silently keeps old code, so versions are never reused.
#
# Manual runs (Actions tab -> Run workflow) accept one optional input:
#   * version: an existing engine version to rebuild (must match a `vX.Y.Z` tag
#     already on this repo, e.g. "0.2.21") instead of cutting a new one. Blank =
#     stamp a fresh <major.minor>.<run_number> as usual. Reusing a version skips
#     the tag-push step (the tag already exists) and checks out that tag's tree
#     rather than the branch head, so the rebuilt wheel matches byte-for-byte.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing vX.Y.Z version to rebuild instead of cutting a new one (blank = new release)"
        required: false
        default: ""

# Serialize releases so two manual runs can't interleave tag-push steps.
concurrency:
  group: engine-release
  cancel-in-progress: false

permissions:
  contents: write # push the v<version> tag to this repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          # Reusing a version pins the checkout to that tag's tree so the rebuilt
          # wheel matches what already shipped; otherwise checkout the commit that
          # triggered this run.
          ref: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute and stamp version
        id: version
        env:
          REUSE_VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'EOF'
          import os, pathlib, re, sys

          reuse = os.environ.get("REUSE_VERSION", "").strip()
          p = pathlib.Path("pyproject.toml")
          src = p.read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"(\d+)\.(\d+)(?:\.\d+)?"', src, re.M)
          if not m:
              sys.exit("pyproject.toml: could not find a version = \"X.Y[.Z]\" line to stamp")
          version = reuse or f"{m.group(1)}.{m.group(2)}.{os.environ['GITHUB_RUN_NUMBER']}"
          p.write_text(src[:m.start()] + f'version = "{version}"' + src[m.end():], encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"wheel=loregraph-{version}-py3-none-any.whl\n")
          print(f"stamped version {version}")
          EOF

      - name: Build wheel
        run: |
          pip install --quiet build
          python -m build --wheel --outdir dist
          test -f "dist/${{ steps.version.outputs.wheel }}" || {
            echo "::error::expected dist/${{ steps.version.outputs.wheel }}; got: $(ls dist)"
            exit 1
          }

      - name: Tag source commit
        # Skipped when reusing an existing version — the tag already exists.
        if: ${{ github.event.inputs.version == '' }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          existing="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          if [ -z "$existing" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          elif [ "$existing" = "$GITHUB_SHA" ]; then
            echo "tag $TAG already points at $GITHUB_SHA (re-run) — skipping"
          else
            echo "::error::tag $TAG already exists on $existing (not $GITHUB_SHA) — refusing to reuse a version"
            exit 1
          fi

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: loregraph-wheel
          path: dist/${{ steps.version.outputs.wheel }}
